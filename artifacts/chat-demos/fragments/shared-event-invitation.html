<div id="shared-event-invitation" lang="zh-CN">
  <style>
    #shared-event-invitation { color: var(--foreground); display: grid; gap: 18px; }
    #shared-event-invitation .event-heading { padding-right: 96px; }
    #shared-event-invitation .event-heading h3 { margin: 0 0 6px; }
    #shared-event-invitation .event-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    #shared-event-invitation .event-group { display: grid; gap: 12px; }
    #shared-event-invitation .event-people { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 12px 8px; }
    #shared-event-invitation .event-person { display: grid; justify-items: center; align-content: start; gap: 6px; min-width: 0; text-align: center; }
    #shared-event-invitation .event-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--muted); color: var(--foreground); }
    #shared-event-invitation .event-person[data-status="attend"] .event-mark { background: color-mix(in srgb, var(--viz-series-1) 28%, transparent); }
    #shared-event-invitation .event-detail { min-height: 36px; overflow-wrap: anywhere; }
    #shared-event-invitation .event-summary { display: grid; gap: 8px; }
    @media (max-width: 479px) {
      #shared-event-invitation .event-people { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }
  </style>

  <div class="event-heading">
    <h3>各自有事，还是一起有事</h3>
    <div class="text-small text-muted">两组均为 10 人 · 每人参加概率均为 90%</div>
  </div>

  <div class="event-group" data-group="independent" role="group" aria-label="各自独立有事的十人">
    <div class="event-row">
      <span>各自有事</span>
      <span class="tabular-nums" data-current>— / 10 人 · —</span>
    </div>
    <div class="event-people">
      <div class="event-person" data-person="0" data-status="pending"><div class="event-mark tabular-nums">01</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="1" data-status="pending"><div class="event-mark tabular-nums">02</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="2" data-status="pending"><div class="event-mark tabular-nums">03</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="3" data-status="pending"><div class="event-mark tabular-nums">04</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="4" data-status="pending"><div class="event-mark tabular-nums">05</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="5" data-status="pending"><div class="event-mark tabular-nums">06</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="6" data-status="pending"><div class="event-mark tabular-nums">07</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="7" data-status="pending"><div class="event-mark tabular-nums">08</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="8" data-status="pending"><div class="event-mark tabular-nums">09</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="9" data-status="pending"><div class="event-mark tabular-nums">10</div><span class="text-small" data-state>待定</span></div>
    </div>
  </div>

  <div class="event-group" data-group="shared" role="group" aria-label="同一次集体加班影响的十人">
    <div class="event-row">
      <span>集体加班</span>
      <span class="tabular-nums" data-current>— / 10 人 · —</span>
    </div>
    <div class="event-people">
      <div class="event-person" data-person="0" data-status="pending"><div class="event-mark tabular-nums">01</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="1" data-status="pending"><div class="event-mark tabular-nums">02</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="2" data-status="pending"><div class="event-mark tabular-nums">03</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="3" data-status="pending"><div class="event-mark tabular-nums">04</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="4" data-status="pending"><div class="event-mark tabular-nums">05</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="5" data-status="pending"><div class="event-mark tabular-nums">06</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="6" data-status="pending"><div class="event-mark tabular-nums">07</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="7" data-status="pending"><div class="event-mark tabular-nums">08</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="8" data-status="pending"><div class="event-mark tabular-nums">09</div><span class="text-small" data-state>待定</span></div>
      <div class="event-person" data-person="9" data-status="pending"><div class="event-mark tabular-nums">10</div><span class="text-small" data-state>待定</span></div>
    </div>
  </div>

  <div class="viz-controls" role="group" aria-label="运行两种条件的对照">
    <button type="button" class="btn btn-primary" data-run="1">比较一次邀约</button>
    <button type="button" class="btn" data-run="20">再比较 20 次</button>
  </div>

  <div class="event-detail text-small" role="status" aria-live="polite" aria-atomic="true" data-detail>尚未模拟 · 甲已报名，十人的门槛均已满足</div>

  <div class="event-summary">
    <div class="event-row">
      <span class="tabular-nums" data-trials>已比较 0 次</span>
      <span class="text-small text-muted">理论平均：两组均为 9 人</span>
    </div>
    <table class="table table-sm" aria-label="两种条件的累计结果">
      <thead><tr><th scope="col">条件</th><th scope="col" class="text-end">平均参加人数</th><th scope="col" class="text-end">全员缺席次数</th></tr></thead>
      <tbody>
        <tr><th scope="row">各自有事</th><td class="text-end tabular-nums" data-mean="independent">—</td><td class="text-end tabular-nums" data-zero="independent">0</td></tr>
        <tr><th scope="row">集体加班</th><td class="text-end tabular-nums" data-mean="shared">—</td><td class="text-end tabular-nums" data-zero="shared">0</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    (() => {
      const root = document.getElementById('shared-event-invitation');
      const buttons = Array.from(root.querySelectorAll('[data-run]'));
      const trialsLabel = root.querySelector('[data-trials]');
      const detail = root.querySelector('[data-detail]');
      const keys = ['independent', 'shared'];
      const groups = keys.map(key => {
        const element = root.querySelector('[data-group="' + key + '"]');
        return {
          key,
          element,
          people: Array.from(element.querySelectorAll('[data-person]')),
          current: element.querySelector('[data-current]'),
          mean: root.querySelector('[data-mean="' + key + '"]'),
          zero: root.querySelector('[data-zero="' + key + '"]'),
          sum: 0,
          zeroCount: 0
        };
      });
      let trials = 0;

      function runOnce() {
        const independent = Array.from({ length: 10 }, () => Math.random() >= 0.1);
        const overtime = Math.random() < 0.1;
        const shared = Array(10).fill(!overtime);
        const result = { independent, shared, overtime };
        trials += 1;
        groups.forEach(group => {
          const count = result[group.key].filter(Boolean).length;
          group.sum += count;
          if (count === 0) group.zeroCount += 1;
        });
        return result;
      }

      function render(result) {
        groups.forEach(group => {
          const attendance = result[group.key];
          const count = attendance.filter(Boolean).length;
          group.people.forEach((person, index) => {
            const attended = attendance[index];
            person.dataset.status = attended ? 'attend' : 'absent';
            person.querySelector('[data-state]').textContent = attended ? '参加' : '缺席';
            person.setAttribute('aria-label', String(index + 1).padStart(2, '0') + '号：' + (attended ? '参加' : '缺席'));
          });
          group.current.textContent = count + ' / 10 人 · ' + count * 10 + '%';
          group.mean.textContent = (group.sum / trials).toFixed(2);
          group.zero.textContent = String(group.zeroCount);
          group.element.dataset.attendance = attendance.map(Number).join('');
          group.element.dataset.sum = String(group.sum);
          group.element.dataset.zeroCount = String(group.zeroCount);
        });
        trialsLabel.textContent = '已比较 ' + trials + ' 次';
        detail.textContent = '第 ' + trials + ' 次共同事件：' + (result.overtime ? '公司安排加班，十人同时缺席。' : '没有集体加班，十人全部参加。');
        root.dataset.trials = String(trials);
      }

      buttons.forEach(button => {
        button.addEventListener('click', () => {
          const count = Number(button.dataset.run);
          let result;
          for (let index = 0; index < count; index += 1) result = runOnce();
          render(result);
        });
      });

      root.dataset.trials = '0';
    })();
  </script>
</div>
